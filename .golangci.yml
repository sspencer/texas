version: "2"

linters:
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - intrange
    - misspell
    - modernize
    - perfsprint
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
        - name: unused-parameter
        - name: receiver-naming
  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sspencer/texas
